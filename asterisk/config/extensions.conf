[general]
static=yes
writeprotect=yes

[from-internal]
; Local SIP/audio check. Dial 600 from endpoint 1001.
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Answer -> fixed greeting -> first speech -> 3 seconds of continuous silence.
; Native DSP handles endpointing; no extra recognition or VAD model is loaded.
exten => 7000,1,NoOp(Fast Contact Router)
 same => n,Answer()
 same => n,Set(FCR_STAGE=GREETING)
 same => n,Playback(fcr/greeting)
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?failed)
 same => n,Set(FCR_STAGE=LISTENING)
 same => n,Set(WAITSTATUS=)
 same => n,WaitForNoise(100,1,30)
 same => n,GotoIf($["${WAITSTATUS}" != "NOISE"]?no-input)
 same => n,Set(FCR_STAGE=SPEECH_STARTED)
 same => n,Set(WAITSTATUS=)
 same => n,WaitForSilence(3000,1,120)
 same => n,GotoIf($["${WAITSTATUS}" != "SILENCE"]?incomplete)
 same => n,Set(FCR_STAGE=CONNECTING_PROMPT)
 same => n,Playback(fcr/connecting)
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?failed)
 same => n,Set(FCR_STAGE=AWAITING_ROUTER)
 same => n,Stasis(fast-contact-router,inbound)
 ; Until the router app exists, this local demo ends after the second prompt.
 same => n,Hangup()
 same => n(no-input),Set(FCR_STAGE=NO_INPUT)
 same => n,Hangup()
 same => n(incomplete),Set(FCR_STAGE=INCOMPLETE)
 same => n,Hangup()
 same => n(failed),Set(FCR_STAGE=FAILED)
 same => n,Hangup()
