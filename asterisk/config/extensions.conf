[phones]
exten => 1001,1,NoOp(Customer calls agent)
 same => n,Stasis(agent-assist,customer,1001)
 same => n,Hangup()
exten => 1002,1,Stasis(agent-assist,agent,1002)
 same => n,Hangup()
exten => 9999,1,Stasis(agent-assist,demo)
 same => n,Hangup()

; ARI originates Local/9999@sample/n. Audio played on ;2 arrives at ;1 RX.
[sample]
exten => 9999,1,Answer()
 same => n,Wait(2)
 same => n,Playback(custom/ko)
 same => n,Wait(3)
 same => n,Hangup()

; Minimal browser phone: only STT microphone and sample playback destinations.
[webphone]
exten => 9998,1,Stasis(agent-assist,microphone)
 same => n,Hangup()
exten => 9999,1,Stasis(agent-assist,demo)
 same => n,Hangup()
