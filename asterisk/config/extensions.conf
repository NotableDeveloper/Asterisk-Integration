[general]
static=yes
writeprotect=yes

[from-internal]
; Answer -> fixed greeting -> first speech -> 3 seconds of continuous silence.
; Native DSP handles endpointing; no extra recognition or VAD model is loaded.
exten => 7000,1,NoOp(Fast Contact Router)
 same => n,Answer()
 same => n,Set(FCR_STAGE=GREETING)
 same => n,Playback(fcr/greeting)
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?failed)
 ; Use a server-created filename. Only a filtered random lookup key crosses from SIP.
 same => n,Set(FCR_KEY=internal)
 same => n,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?record)
 same => n,Set(FCR_TOKEN=${FILTER(0-9a-f,${PJSIP_HEADER(read,X-Inquiry-Key)})})
 same => n,ExecIf($[${LEN(${FCR_TOKEN})} = 32]?Set(FCR_KEY=${FCR_TOKEN}))
 same => n(record),Set(FCR_FILE=${SHELL(mktemp --suffix=.wav /inquiries/open-XXXXXXXXXX | tr -d '[:space:]')})
 same => n,GotoIf($["${FCR_FILE}" = ""]?failed)
 same => n,MixMonitor(,r(${FCR_FILE})i(FCR_MONITOR))
 same => n,GotoIf($["${FCR_MONITOR}" = ""]?failed)
 same => n,Set(FCR_STAGE=LISTENING)
 same => n,Set(WAITSTATUS=)
 same => n,WaitForNoise(100,1,30)
 same => n,GotoIf($["${WAITSTATUS}" != "NOISE"]?no-input)
 same => n,Set(FCR_STAGE=SPEECH_STARTED)
 same => n,Set(WAITSTATUS=)
 same => n,WaitForSilence(3000,1,120)
 same => n,GotoIf($["${WAITSTATUS}" != "SILENCE"]?incomplete)
 same => n,StopMixMonitor(${FCR_MONITOR})
 same => n,System(chmod 640 ${FCR_FILE} && mv ${FCR_FILE} /inquiries/ready-${FCR_KEY}-${CUT(FCR_FILE,/,3)})
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?failed)
 same => n,Set(FCR_FILE=)
 same => n,Set(FCR_STAGE=CONNECTING_PROMPT)
 same => n,Playback(fcr/connecting)
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?failed)
 same => n,Set(FCR_STAGE=AWAITING_ROUTER)
 same => n,Stasis(fast-contact-router,inbound)
 ; Until the router app exists, this local demo ends after the second prompt.
 same => n,Hangup()
 same => n(no-input),Set(FCR_STAGE=NO_INPUT)
 same => n,Hangup()
 same => n(incomplete),Set(FCR_STAGE=INCOMPLETE)
 same => n,Hangup()
 same => n(failed),Set(FCR_STAGE=FAILED)
 same => n,Hangup()

; Discard partial recordings on no input, timeout or early hangup.
exten => h,1,ExecIf($["${FCR_FILE}" != ""]?System(rm -f ${FCR_FILE}))
