[modules]
autoload=yes

; Load the HTTP WebSocket handler before the PJSIP WebSocket transport.
preload=res_http_websocket.so
; Avoid the legacy SIP driver's competing port 5060.
noload=chan_sip.so
noload=chan_iax2.so
noload=chan_unistim.so
noload=chan_alsa.so
noload=chan_oss.so
noload=chan_console.so
noload=app_jack.so

; No external databases, voicemail, geolocation, or packet capture in this PoC.
noload=res_config_ldap.so
noload=res_config_pgsql.so
noload=res_geolocation.so
noload=res_pjsip_geolocation.so
noload=cdr_radius.so
noload=cel_radius.so
noload=cdr_sqlite3_custom.so
noload=cel_sqlite3_custom.so
noload=cdr_tds.so
noload=cel_tds.so
noload=cdr_pgsql.so
noload=cel_pgsql.so
noload=pbx_dundi.so
noload=res_hep.so
noload=res_hep_rtcp.so
noload=res_hep_pjsip.so
noload=app_voicemail.so
noload=app_voicemail_imap.so
noload=app_voicemail_odbc.so
noload=res_phoneprov.so
noload=res_pjsip_phoneprov_provider.so
noload=res_prometheus.so
noload=res_adsi.so
noload=app_adsiprog.so
noload=app_getcpeid.so
noload=app_macro.so
