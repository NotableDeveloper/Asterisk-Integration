[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; For softphones outside Docker, set external_media_address and
; external_signaling_address to this Mac's LAN IP, and local_net to Docker subnet.

[phone](!)
type=endpoint
transport=transport-udp
context=phones
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001](phone)
auth=1001-auth
aors=1001
[1001-auth]
type=auth
auth_type=userpass
username=1001
password=demo-agent-1001
[1001]
type=aor
max_contacts=1
remove_existing=yes

[1002](phone)
auth=1002-auth
aors=1002
[1002-auth]
type=auth
auth_type=userpass
username=1002
password=demo-customer-1002
[1002]
type=aor
max_contacts=1
remove_existing=yes

; Browser-only SIP endpoint. Signaling reaches this transport via /sip proxy.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[1003]
type=aor
max_contacts=1
remove_existing=yes
[1003-auth]
type=auth
auth_type=userpass
username=1003
password=demo-web-1003
[1003]
type=endpoint
transport=transport-ws
context=webphone
auth=1003-auth
aors=1003
webrtc=yes
dtls_auto_generate_cert=yes
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=60
