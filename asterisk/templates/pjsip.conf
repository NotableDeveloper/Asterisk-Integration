[global]
type=global
user_agent=FastContactRouter

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
external_signaling_address=127.0.0.1
external_media_address=127.0.0.1

[1001]
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=${SIP_PASSWORD}

[1001]
type=aor
max_contacts=1
remove_existing=yes
