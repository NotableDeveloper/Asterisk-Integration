server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;

    # This credential-bearing development phone is only served for loopback hosts.
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws://localhost:8080 ws://127.0.0.1:8080; media-src 'self' blob:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /config.json {
        if ($http_sec_fetch_site = cross-site) { return 403; }
        try_files $uri =404;
    }
    location ~ "^/inquiries/[0-9a-f]{32}$" {
        access_log off;
        if ($http_sec_fetch_site = cross-site) { return 403; }
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $whisper_backend whisper:8000;
        proxy_pass http://$whisper_backend;
    }
    location = /ws {
        if ($http_origin !~ ^http://(localhost|127\.0\.0\.1):8080$) { return 403; }
        resolver 127.0.0.11 valid=10s;
        set $asterisk_backend asterisk:8088;
        proxy_pass http://$asterisk_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
